<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototipo PowerFit</title>
<style>
:root{--bg:#0F1115;--panel:#16181D;--tx:#E5E7EB;--mut:#9CA3AF;--ac:#F97316}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid #262A31;flex-wrap:wrap}
header b{color:#fff}.tag{background:#3B1D0E;color:#FDBA74;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:600}
button,select{background:#22262D;color:var(--tx);border:1px solid #333842;border-radius:8px;padding:7px 11px;font:inherit;cursor:pointer}
select{max-width:min(420px,100%)}.sp{flex:1}.mut{color:var(--mut);font-size:12.5px}
main{flex:1;display:grid;place-items:center;padding:16px}
.stage{position:relative;width:min(100%,calc((100vh - 120px)*1.6));aspect-ratio:1280/800;box-shadow:0 20px 60px rgba(0,0,0,.5);border-radius:6px;overflow:hidden;background:#fff}
.stage img{width:100%;height:100%;display:block;user-select:none}
.hs{position:absolute;cursor:pointer;border-radius:6px}
.stage.hint .hs{background:rgba(249,115,22,.22);outline:2px solid rgba(249,115,22,.9);transition:background .2s}
footer{padding:8px 16px;text-align:center}
</style></head><body>
